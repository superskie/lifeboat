<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-labelledby="t d">
  <title id="t">lifeboat</title>
  <desc id="d">A small winged lifeboat carries glowing assets away from a sinking wallet while a sweeper drone keeps scanning the empty wreck. A figure in a lab coat lights the way with a flask.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070d1a"/>
      <stop offset="0.62" stop-color="#0c1c30"/>
      <stop offset="1" stop-color="#0d2a3f"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#11405a"/>
      <stop offset="1" stop-color="#081826"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f87171" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f87171" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fde68a" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#fbbf24" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mint" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5eead4" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame"><rect width="1280" height="420" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="420" fill="url(#sky)"/>

    <!-- stars -->
    <g fill="#cbd5e1">
      <circle cx="96" cy="48" r="1.4" opacity="0.7"/><circle cx="212" cy="92" r="1" opacity="0.5"/>
      <circle cx="338" cy="36" r="1.2" opacity="0.6"/><circle cx="472" cy="70" r="1" opacity="0.45"/>
      <circle cx="590" cy="30" r="1.5" opacity="0.7"/><circle cx="668" cy="104" r="1" opacity="0.5"/>
      <circle cx="742" cy="52" r="1.2" opacity="0.6"/><circle cx="846" cy="26" r="1" opacity="0.5"/>
      <circle cx="930" cy="84" r="1.3" opacity="0.55"/><circle cx="1010" cy="40" r="1" opacity="0.5"/>
      <circle cx="1196" cy="34" r="1.4" opacity="0.65"/><circle cx="1242" cy="110" r="1" opacity="0.45"/>
    </g>

    <!-- chalk notes: the experiment, written on the night sky -->
    <g font-family="'Cascadia Code','SFMono-Regular',Consolas,'Liberation Mono',monospace" fill="#8fb3c7" opacity="0.5" font-size="15">
      <text x="640" y="150" transform="rotate(-4 640 150)">gas &#8594; operator, never the wallet</text>
      <text x="1010" y="178" transform="rotate(3 1010 178)">&#8756; nothing to sweep</text>
      <text x="700" y="94" transform="rotate(2 700 94)">1 tx &#183; all or nothing</text>
    </g>

    <!-- sea, back layer -->
    <path d="M0 292 C 90 280, 170 304, 260 292 S 430 280, 520 292 S 690 304, 780 292 S 950 280, 1040 292 S 1210 304, 1280 292 L1280 420 L0 420 Z" fill="url(#sea)"/>

    <!-- the wreck: a drained wallet going under -->
    <g transform="translate(1068 250) rotate(17)">
      <rect x="-70" y="-46" width="140" height="92" rx="14" fill="#1b3349" stroke="#4f7896" stroke-width="3"/>
      <rect x="18" y="-14" width="62" height="30" rx="9" fill="#0f2233" stroke="#4f7896" stroke-width="3"/>
      <circle cx="40" cy="1" r="5" fill="#4f7896"/>
      <path d="M-52 -30 l22 26 l-14 10 l20 28" fill="none" stroke="#4f7896" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- the sweeper: still scanning, finding nothing -->
    <path d="M1090 118 L1012 300 L1168 300 Z" fill="url(#beam)"/>
    <g transform="translate(1090 104)">
      <path d="M-42 -6 h-22 M42 -6 h22" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
      <ellipse cx="-64" cy="-8" rx="15" ry="3.5" fill="#64748b"/>
      <ellipse cx="64" cy="-8" rx="15" ry="3.5" fill="#64748b"/>
      <rect x="-42" y="-20" width="84" height="34" rx="17" fill="#1f2937" stroke="#64748b" stroke-width="3"/>
      <circle cx="0" cy="-3" r="9" fill="#f87171"/>
      <circle cx="0" cy="-3" r="3.5" fill="#fee2e2"/>
    </g>

    <!-- the lifeboat, pulling away with everything that could not be moved before -->
    <g transform="translate(792 306)">
      <circle cx="-34" cy="-104" r="74" fill="url(#glow)"/>
      <circle cx="74" cy="-34" r="64" fill="url(#mint)"/>

      <!-- cargo: a claim, a stake, a collectible -->
      <g transform="translate(40 -40)">
        <circle cx="0" cy="0" r="17" fill="#0f766e" stroke="#5eead4" stroke-width="3"/>
        <path d="M-7 0 l5 6 l10 -12" fill="none" stroke="#ccfbf1" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <g transform="translate(80 -32)">
        <path d="M0 -19 L16.5 -9.5 L16.5 9.5 L0 19 L-16.5 9.5 L-16.5 -9.5 Z" fill="#134e4a" stroke="#5eead4" stroke-width="3" stroke-linejoin="round"/>
        <circle cx="0" cy="0" r="5" fill="#5eead4"/>
      </g>
      <g transform="translate(116 -36)">
        <rect x="-13" y="-6" width="26" height="22" rx="5" fill="#0f766e" stroke="#5eead4" stroke-width="3"/>
        <path d="M-7 -6 v-6 a7 7 0 0 1 14 0 v6" fill="none" stroke="#5eead4" stroke-width="3"/>
      </g>

      <!-- the one at the bow: lab coat, flask held high as a lantern -->
      <g transform="translate(-58 -30)">
        <path d="M-15 12 L-12 -34 Q0 -44 12 -34 L15 12 Z" fill="#e2e8f0"/>
        <path d="M0 -38 L0 12" stroke="#94a3b8" stroke-width="2"/>
        <circle cx="0" cy="-52" r="11" fill="#e2e8f0"/>
        <path d="M10 -30 L26 -62" stroke="#e2e8f0" stroke-width="6" stroke-linecap="round"/>
        <g transform="translate(26 -80)">
          <path d="M-4 -14 h8 v10 l11 18 a4 4 0 0 1 -3.5 6 h-23 a4 4 0 0 1 -3.5 -6 l11 -18 Z" fill="#fde68a" stroke="#fbbf24" stroke-width="2.5" stroke-linejoin="round"/>
          <path d="M-6 -15 h12" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
        </g>
      </g>

      <!-- hull -->
      <path d="M-128 -24 H150 Q142 28 96 30 H-74 Q-116 28 -128 -24 Z" fill="#f97316"/>
      <path d="M-128 -24 H150" stroke="#fed7aa" stroke-width="6" stroke-linecap="round"/>
      <path d="M-104 6 H128" stroke="#c2410c" stroke-width="4" stroke-linecap="round" opacity="0.7"/>

      <!-- a wing at the stern: a messenger's boat -->
      <g transform="translate(136 -22)" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" stroke-linejoin="round">
        <path d="M0 0 C 26 -34, 62 -44, 96 -40 C 76 -30, 60 -20, 46 -4 Z"/>
        <path d="M2 4 C 30 -16, 60 -22, 86 -18 C 68 -10, 54 -2, 42 8 Z"/>
        <path d="M4 9 C 26 0, 48 -2, 68 2 C 54 8, 44 12, 34 18 Z"/>
      </g>
    </g>

    <!-- sea, front layer -->
    <path d="M0 338 C 80 326, 160 350, 240 338 S 400 326, 480 338 S 640 350, 720 338 S 880 326, 960 338 S 1120 350, 1280 336 L1280 420 L0 420 Z" fill="#0a2233"/>
    <path d="M0 374 C 100 364, 200 384, 300 374 S 500 364, 600 374 S 800 384, 900 374 S 1100 364, 1280 374 L1280 420 L0 420 Z" fill="#071726"/>
    <path d="M596 340 q22 -10 44 0 M664 344 q16 -8 32 0" fill="none" stroke="#7dd3fc" stroke-width="2.5" stroke-linecap="round" opacity="0.45"/>

    <!-- words -->
    <g font-family="'Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif">
      <g transform="translate(72 96)">
        <rect width="262" height="34" rx="17" fill="#0f2437" stroke="#28506b" stroke-width="1.5"/>
        <text x="131" y="22.5" text-anchor="middle" font-size="14.5" font-weight="600" fill="#9cc7dc" letter-spacing="0.6">HERMES AGENT PLUGIN &#183; EIP-7702</text>
      </g>
      <text x="68" y="214" font-size="96" font-weight="800" fill="#f8fafc" letter-spacing="-3">lifeboat</text>
      <text x="74" y="262" font-size="25" font-weight="500" fill="#cbd5e1">Rescue what the sweeper left behind.</text>
      <text x="74" y="296" font-size="18" fill="#7fa3b8">One transaction. The drained wallet never pays.</text>
    </g>
  </g>
</svg>
